<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EllePimpTaFood">
<meta name="theme-color" content="#fbf6f2">
<title>EllePimpTaFood</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Geist:wght@400;500;600&display=swap">
<style>


  :root {
    --bg: #f4ecd4;
    --app-bg: #fbf6f2;
    --surface: #ffffff;
    --ink: #2f2f33;
    --muted: #7b7263;
    --line: #ece0bf;
    --accent: #b8680f;
    --accent-soft: #f7e3b8;
    --accent-ink: #8a4c06;
    --sage: #4f6d53;
    --sage-soft: #e1ebdf;
    --amber-soft: #fbefd2;
    --amber-ink: #8a5a00;
    --frame: #2f2f33;
    --wa: #1faa55;
    --shadow: 0 30px 60px -30px rgba(60, 40, 20, .35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171412; --app-bg: #1f1b18; --surface: #292421; --ink: #f1ebe4; --muted: #a89c91;
      --line: #3a332e; --accent: #e39a3b; --accent-soft: #3b2c14; --accent-ink: #f2c47e;
      --sage: #8fb893; --sage-soft: #24302a; --amber-soft: #3a2f18; --amber-ink: #e7c16a;
      --frame: #000; --shadow: 0 30px 60px -30px rgba(0,0,0,.7); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171412; --app-bg: #1f1b18; --surface: #292421; --ink: #f1ebe4; --muted: #a89c91;
    --line: #3a332e; --accent: #e39a3b; --accent-soft: #3b2c14; --accent-ink: #f2c47e;
    --sage: #8fb893; --sage-soft: #24302a; --amber-soft: #3a2f18; --amber-ink: #e7c16a;
    --frame: #000; --shadow: 0 30px 60px -30px rgba(0,0,0,.7); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px;
    padding-inline: 16px; padding-block: 28px 48px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .display { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 600; letter-spacing: -.01em; }

  .wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }
  .intro { display: grid; gap: 10px; max-width: 62ch; }
  .intro h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0; text-wrap: balance; }
  .intro p { margin: 0; color: var(--muted); line-height: 1.55; }
  .tag { display: inline-block; width: fit-content; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent-soft); padding: 4px 10px; border-radius: 99px; }

  .switch { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px; gap: 4px; width: fit-content; }
  .switch button { border: 0; background: transparent; padding: 8px 16px; border-radius: 99px; font-weight: 500; color: var(--muted); }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--app-bg); }

  .stage { display: grid; grid-template-columns: 390px 1fr; gap: 40px; align-items: start; }
  .phone { background: var(--frame); border-radius: 46px; padding: 12px; box-shadow: var(--shadow); position: relative; }
  .screen { background: var(--app-bg); border-radius: 36px; height: 760px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .statusbar { display: flex; justify-content: space-between; padding: 14px 26px 4px; font-size: 12px; font-weight: 600; }
  .notes { display: grid; gap: 18px; position: sticky; top: 24px; }
  .note { border-left: 2px solid var(--accent); padding: 2px 0 2px 16px; display: grid; gap: 6px; }
  .note h2 { font-size: 1.25rem; margin: 0; }
  .note p { margin: 0; color: var(--muted); line-height: 1.55; max-width: 52ch; }
  .note ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.6; }
  .linked { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
  .linked strong { color: var(--ink); }
  .reset { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; width: fit-content; font-size: 13px; }

  /* ---- App ---- */
  .appbar { padding: 6px 18px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .appbar-top { display: flex; justify-content: space-between; align-items: center; }
  .appbar .display { font-size: 17px; }
  .who { font-size: 12px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 99px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .tabs button[aria-current="true"] { background: var(--ink); color: var(--app-bg); }
  .content { flex: 1; overflow-y: auto; padding: 16px 18px 24px; display: grid; gap: 16px; align-content: start; }
  .footer { border-top: 1px solid var(--line); padding: 12px 18px 22px; background: var(--app-bg); display: grid; gap: 6px; }

  .h1 { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 600; font-size: 24px; margin: 0; line-height: 1.15; }
  .h2 { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 600; font-size: 17px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pill { font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .p-wait { background: var(--amber-soft); color: var(--amber-ink); }
  .p-todo { background: var(--accent-soft); color: var(--accent-ink); }
  .p-ok { background: var(--sage-soft); color: var(--sage); }
  .btn { border: 0; border-radius: 99px; padding: 11px 16px; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-secondary { background: var(--surface); border: 1px solid var(--line); }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-block { width: 100%; }
  .link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; text-align: left; }
  .back { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; text-align: left; width: fit-content; }

  .steps { display: flex; gap: 6px; }
  .steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .steps span.on { background: var(--sage); }
  .step-title { display: flex; align-items: center; gap: 10px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--ink); color: var(--app-bg); flex-shrink: 0; }
  .dot.done { background: var(--sage); color: #fff; }

  .cat-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .count { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .count.full { color: var(--sage); font-weight: 600; }
  .dish { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 6px; }
  .dish[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .dish:disabled { opacity: .4; cursor: not-allowed; }
  .tick { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); flex-shrink: 0; display: grid; place-items: center; font-size: 11px; margin-top: 1px; }
  .dish[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dish b { display: block; font-weight: 500; font-size: 13.5px; line-height: 1.3; }
  .dish i { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; }

  .aisle { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 4px 0 6px; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item input { width: 18px; height: 18px; accent-color: var(--sage); flex-shrink: 0; }
  .item label { flex: 1; font-size: 14px; cursor: pointer; }
  .item .qty { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item.checked label, .item.checked .qty { color: var(--muted); text-decoration: line-through; font-weight: 400; }

  .stepper { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  .stepper button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--app-bg); font-size: 18px; line-height: 1; }
  .stepper strong { font-variant-numeric: tabular-nums; font-size: 18px; min-width: 22px; text-align: center; }

  .slot { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 8px; text-align: left; }
  .slot:hover { border-color: var(--muted); }
  .slot.booked { background: var(--sage-soft); border-color: transparent; }
  .slot .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .day { font-weight: 500; }

  .banner { border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
  .b-amber { background: var(--amber-soft); color: var(--amber-ink); }
  .b-sage { background: var(--sage-soft); color: var(--sage); }

  .toast { position: absolute; left: 16px; right: 16px; bottom: 26px; background: var(--ink); color: var(--app-bg); border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s ease; z-index: 5; }
  .toast.show { transform: none; opacity: 1; }
  .toast small { display: block; opacity: .7; margin-top: 4px; white-space: pre-line; }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input { font: inherit; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
  .grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }


  .brand { display: flex; align-items: center; gap: 16px; }
  .brand h1 { margin: 0; color: var(--accent-ink); }
  .brand-sub { margin: 2px 0 0; color: var(--ink) !important; font-weight: 500; }
  .logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; transform: scale(1); background: #f3e3a3; flex-shrink: 0; }
  .logo-md { width: 58px; height: 58px; }
  .logo-lg { width: 92px; height: 92px; box-shadow: 0 10px 24px -12px rgba(80,50,10,.5); }
  .appname { display: inline-flex; align-items: center; gap: 8px; }
  .hello { display: flex; align-items: center; gap: 12px; }
  .display, .h1, .h2 { font-weight: 600; letter-spacing: 0; }
  @media (max-width: 860px) {
    .stage { grid-template-columns: 1fr; }
    .notes { position: static; order: -1; }
    .phone { max-width: 390px; width: 100%; margin: 0 auto; }
  }
  @media (max-width: 440px) {
    body { padding-inline: 12px; }
    .phone { padding: 0; background: none; box-shadow: none; }
    .screen { border-radius: 24px; border: 1px solid var(--line); height: 720px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
  .opt:first-of-type { border-top: 0; }
  .opt input { width: 17px; height: 17px; accent-color: var(--accent); margin-top: 1px; flex-shrink: 0; }
  .opt .price { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  .seg { display: flex; gap: 4px; background: var(--app-bg); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 99px; padding: 6px 4px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--app-bg); }
  .summary { font-weight: 600; font-size: 14px; }
  .gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 3px; }
  .gcard b { font-weight: 500; font-size: 13.5px; }
  .gcard p { margin: 0; font-size: 12.5px; color: var(--muted); white-space: pre-line; line-height: 1.45; }
  .glist { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.55; }
  .prio { background: var(--accent-soft); border-color: transparent; }
  .have { border: 0; background: none; font-size: 11.5px; color: var(--muted); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .have:hover { background: var(--line); }
  .item.athome label, .item.athome .qty { color: var(--muted); text-decoration: line-through; font-weight: 400; }
  .item.athome .have { background: var(--line); color: var(--ink); }
  .tagline { font-size: 11px; color: var(--muted); margin-left: 6px; text-decoration: none; display: inline-block; }
  .addrow { display: grid; grid-template-columns: 1fr 5.5rem auto; gap: 6px; margin-top: 6px; }
  .addrow input { font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
  .rm { border: 0; background: none; color: var(--muted); padding: 0 2px; }
  textarea.note { font: inherit; font-size: 13px; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--surface); color: var(--ink); resize: vertical; }
  .cal { display: grid; gap: 4px; }
  .cal-head, .cal-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head span { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; }
  .day { border: 0; border-radius: 10px; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; font: inherit; }
  .day b { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .day b small { font-size: 9px; font-weight: 400; }
  .day span { font-size: 9.5px; line-height: 1.1; }
  .day.past { color: var(--muted); opacity: .45; }
  .day.off { background: #efe4e1; color: #a8574c; opacity: .8; cursor: not-allowed; }
  .day .offlab { font-weight: 700; font-size: 10px; letter-spacing: .04em; }
  .day.taken { background: var(--accent-soft); color: var(--muted); }
  .day.taken span { text-decoration: line-through; }
  .day.mine { background: var(--sage); color: #fff; }
  .day.free { background: var(--surface); border: 1.5px solid var(--accent); color: var(--ink); cursor: pointer; }
  .day.free:hover { background: var(--accent-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .lg.mine { background: var(--sage); } .lg.free { border: 1.5px solid var(--accent); } .lg.taken { background: var(--accent-soft); } .lg.off { background: #efe4e1; }
  .day { justify-content: flex-start; padding: 3px 2px; min-height: 58px; }
  .halves { display: grid; gap: 2px; width: 100%; margin-top: 2px; }
  .half { display: block; border-radius: 5px; font-size: 9px; line-height: 1.25; padding: 1px 2px; text-align: center; white-space: nowrap; overflow: hidden; }
  .half i { font-style: normal; opacity: .65; }
  .half.free { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .half.taken { background: var(--accent-soft); color: var(--muted); text-decoration: line-through; }
  .half.mine { background: rgba(255,255,255,.25); color: #fff; }
  .day.partial, .day.taken { background: var(--surface); color: var(--ink); }
  .day.taken { opacity: .75; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: 12.5px; }
  .gweek { display: grid; gap: 8px; }
  .wtag { font-family: "Geist", system-ui, sans-serif; font-size: 11px; font-weight: 500; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; vertical-align: 2px; }
  .gcard .row b { font-size: 13.5px; font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .badge.fridge { background: var(--accent-soft); color: var(--accent-ink); }
  .badge.frozen { background: #e3ebf3; color: #3d5a78; }
  .gcard dl { margin: 2px 0 0; display: grid; gap: 4px; }
  .gcard dl div { display: grid; grid-template-columns: 88px 1fr; gap: 8px; font-size: 12.5px; }
  .gcard dt { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding-top: 1px; }
  .gcard dd { margin: 0; }
  details.card summary { cursor: pointer; list-style: none; }
  details.card summary::after { content: " +"; color: var(--muted); }
  details[open].card summary::after { content: " −"; }
  .vg { margin: -2px 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--sage); }
  .home { gap: 12px; }
  .formula { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--accent-ink); }
  .weeks { display: grid; gap: 8px; }
  .wk { background: var(--app-bg); border-radius: 14px; padding: 10px 12px; }
  .wk-title { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .wk ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
  .wk li:not(.todo) { position: relative; padding-left: 12px; font-size: 13px; line-height: 1.35; }
  .wk li:not(.todo)::before { content: "–"; position: absolute; left: 0; color: var(--muted); }
  .wk ul { gap: 2px; }
  .wk li.todo { border: 1px dashed var(--line); border-radius: 8px; padding: 2px 8px; color: var(--muted); font-size: 12.5px; }
  .history { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
  .history .item label { cursor: default; }
  .wtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .wtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 10px; text-align: left; display: grid; gap: 2px; }
  .wtabs button b { font-weight: 600; font-size: 13px; }
  .wtabs button span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wtabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--app-bg); }
  .wtabs button[aria-pressed="true"] span { color: var(--app-bg); opacity: .8; }
  .dish i.elsewhere { color: var(--accent-ink); }
  .wset { gap: 8px; }
  .wset .seg { flex: 0 0 auto; }
  .wset .seg button { padding: 5px 14px; }
  .wk-plan { margin: 0 0 4px; font-size: 11.5px; color: var(--muted); }
  .note-in { font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
  .shopseg button { font-size: 12.5px; padding: 7px 8px; }
  .wlabel { font-weight: 700; font-size: 15px; }
  .wopt { border: 0 !important; padding: 2px 0 !important; align-items: center; }
  .passage { margin: 0; color: var(--ink); }
  .passage b { font-weight: 600; }
  .dur { gap: 8px; flex-wrap: wrap; }
  .dur .seg { flex: 0 0 auto; }
  .dur .seg button { padding: 6px 12px; font-size: 13px; white-space: nowrap; flex: 0 0 auto; }
  .wtabs.one { grid-template-columns: 1fr; }

  /* ===== DA « Doux Pastel » reprise de l'appli Courses & Repas ===== */
  :root, :root[data-theme="dark"] { --bg: #fbf6f2; --app-bg: #fbf6f2; --surface: #ffffff; --ink: #58291b; --muted: #b0603e;

const AISLES = ["Viandes & poissons","Légumes & fruits","Produits frais","Épicerie","Féculents à prévoir","Herbes & épices","Fruits & légumes","Boucherie & volaille","Poissonnerie","Crèmerie & fromages","Épicerie salée","Épicerie sucrée","Surgelés","Autre","À prévoir","Mes ajouts"];
const COUNTABLE = new Set(["pièce","gousse","botte","boîte","pot","sachet","paquet","rouleau","tranche","cube"]);
function round(q, u) {
  if (COUNTABLE.has(u)) return Math.max(1, Math.ceil(q - 1e-9));
  if (u === "g" || u === "ml") { const s = q < 100 ? 5 : 10; return Math.max(s, Math.ceil(q / s - 1e-9) * s); }
  return Math.max(.5, Math.ceil(q * 2 - 1e-9) / 2);
}
function fmt(q, u) {
  if (q == null) return u || "";
  const n = x => x.toLocaleString("fr-FR", { maximumFractionDigits: 2 });
  if (u === "g" && q >= 1000) return `${n(q / 1000)} kg`;
  if (u === "ml" && q >= 1000) return `${n(q / 1000)} L`;
  if (u === "ml" && q >= 100) return `${n(q / 10)} cl`;
  if (u === "pièce") return n(q);
  if (COUNTABLE.has(u) && q > 1 && !u.endsWith("s")) return `${n(q)} ${u}s`;
  return `${n(q)} ${u}`;
}
function buildList(ids, servings) {
  const tot = new Map();
  for (const id of ids) {
    for (const [name, qty, unit] of DATA.recipes[id].lines) {
      const k = name + "|" + unit, q = qty * servings / 4;
      if (tot.has(k)) tot.get(k).q += q; else tot.set(k, { name, unit, q, aisle: DATA.aisles[name] || "Autre" });
    }
  }
  const list = [...tot.values()].map(i => ({ ...i, q: round(i.q, i.unit) }))
    .sort((a, b) => AISLES.indexOf(a.aisle) - AISLES.indexOf(b.aisle) || a.name.localeCompare(b.name, "fr"));
  if (ids.length) list.push({ name: "Sel & poivre", q: null, unit: null, aisle: "À prévoir" },
                            { name: "Boîtes (Tupperware ou alu)", q: null, unit: `${ids.length * 2} à ${ids.length * 3}`, aisle: "À prévoir" });
  return list;
}

function parseReheat(text) {
  if (!text) return [];
  return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
    const m = [[/air ?fryer/i, "Air fryer"], [/\bfour\b/i, "Four"], [/poêle/i, "Poêle"], [/micro-?ondes/i, "Micro-ondes"], [/\briz\b|féculent|pâtes/i, "À cuire"]].filter(([re]) => re.test(line)).map(([, l]) => l);
    const t = line.replace(/^(ou\s+)?(air ?fryer|four)\s*:\s*/i, "").replace(/^à la poêle,\s*/i, "");
    return { method: m.length ? m.slice(0, 2).join(" / ") : "Conseil", text: t.charAt(0).toUpperCase() + t.slice(1) };
  });
}

    const fv = venueById(sel);
    body = `<div class="hello"><img class="logo logo-md" src="${LOGO}" alt=""><div><h1 class="h1" style="font-size:21px">Mes fiches réchauffage</h1><p class="small muted" style="margin:2px 0 0">Comment réchauffer chaque plat</p></div></div>
      <div class="wtabs">${visits.map(([k, dlab, lab]) => `<button data-fiche="${k}" aria-pressed="${sel === k}"><b>${dlab}</b><span>${lab}</span></button>`).join("")}</div>
      ${fv.done ? guideHtml(fv) + `<button class="btn btn-secondary" id="print">Imprimer / enregistrer en PDF</button>`
        : `<div class="card"><p style="margin:0">La fiche de tes plats arrivera ici juste après le passage d'Emeline${fv.date ? `, ${dayName(fv.date)}` : ""}.</p></div>`}`;
  }

  return bar + `<div class="content">${body}</div>` + (footer ? `<div class="footer">${footer}</div>` : "") + nav;
}

function render() {
  const scroll = $app.querySelector(".content")?.scrollTop || 0;
  const key = S.view + S.client + S.cook + S.week;
  $app.innerHTML = clientView();
  if (render.last === key) { const c = $app.querySelector(".content"); if (c) c.scrollTop = scroll; }
  render.last = key;
  save();
}

// ---------- Interactions ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "reset") { try { localStorage.removeItem(STORE_KEY); } catch (e) {} S = initial(); return render(); }
  if (t.dataset.goClient) { S.client = t.dataset.goClient; return render(); }
  if (t.dataset.week) { S.week = +t.dataset.week; return render(); }
  if (t.dataset.fiche) { S.ficheVisit = t.dataset.fiche; return render(); }
  if (t.dataset.venue) { S.current = t.dataset.venue; S.week = 1; return render(); }
  if (t.dataset.ficheGo) { S.client = "fiche"; S.ficheVisit = t.dataset.ficheGo; return render(); }
  if (t.dataset.movev) { S.move = t.dataset.movev; S.client = "creneau"; return render(); }
  if (t.id === "move-cancel") { S.move = null; return render(); }
  if (t.dataset.cancelv) {
    const v = venueById(t.dataset.cancelv);
    if (v.picks.size && !confirm(`Annuler la ${venueTitle(v).toLowerCase()} ? Les ${v.picks.size} plats choisis pour cette venue seront perdus.`)) return;
    S.venues = S.venues.filter(x => x.id !== v.id);
    if (S.move === v.id) S.move = null;
    ensureUpcoming(); S.current = defaultVenue(); S.week = 1; render();
    return toast("Venue annulée ✓", "Le jour redevient libre pour les autres clients, et Emeline est prévenue.");
  }
  if (t.id === "reset-picks") {
    if (!confirm("Recommencer tes choix pour cette venue ? Les plats sélectionnés seront retirés.")) return;
    V().picks.clear(); V().submitted = false; S.week = 1; render();
    return toast("Choix remis à zéro ✓", "Tes autres venues et ton panier ne bougent pas.");
  }
  if (t.dataset.dur) {
    V().weeks = +t.dataset.dur;
    if (V().weeks === 1) { for (const [id, w] of [...V().picks]) if (w > 1) V().picks.delete(id); S.week = 1; }
    return render();
  }
  if (t.dataset.wdishes) {
    const n = +t.dataset.wdishes, extra = inWeek(S.week, false).slice(n);
    extra.forEach(id => V().picks.delete(id));
    plan(S.week).dishes = n; return render();
  }
  if (t.dataset.dish) {
    const id = t.dataset.dish;
    if (R(id).category === "sucre") plan(S.week).sweet = true;
    if (V().picks.get(id) === S.week) V().picks.delete(id); else V().picks.set(id, S.week);
    if (weekDone(S.week) && S.week < V().weeks && !weekDone(S.week + 1)) { S.week++; render(); return toast(`${weeks()[S.week - 2]} complète ✓`, `On passe à la ${weeks()[S.week - 1].toLowerCase()}.`); }
    return render();
  }
  if (t.id === "submit") {
    const first = !V().submitted;
    V().submitted = true; V().checked.clear(); S.client = "home"; render();
    return toast(first ? "Choix envoyé ✓" : "Choix mis à jour ✓", "Emeline reçoit une notification. Tu seras prévenue dès que ta liste de courses sera prête.");
  }
  if (t.dataset.day) {
    const iso = t.dataset.day;
    if (S.move) {
      const v = venueById(S.move); S.move = null; v.date = iso; sortVenues(); S.current = v.id; render();
      return toast("Venue déplacée ✓", `${slotLabel(iso)}. Ses plats et son panier la suivent.`);
    }
    if (!V().date) { V().date = iso; sortVenues(); render(); return toast("Venue réservée ✓", `${slotLabel(iso)}. Ce jour apparaît « réservé » pour les autres clients, et Emeline est prévenue.`); }
    S.venues.push(newVenue(iso)); sortVenues(); render();
    return toast("Nouvelle venue réservée ✓", `${slotLabel(iso)}. Tu prépares toujours ta venue du ${frDay(V().date)} : pour choisir les plats de celle-ci, sélectionne-la en haut de l'onglet Plats.`);
  }
  if (t.dataset.have) { const k = t.dataset.have; V().have.has(k) ? V().have.delete(k) : V().have.add(k); return render(); }
  if (t.dataset.rm) { V().mine = V().mine.filter(m => m.id !== t.dataset.rm); return render(); }
  if (t.id === "add-item") {
    const name = document.getElementById("add-name").value.trim();
    if (!name) return document.getElementById("add-name").focus();
    V().mine.push({ id: "m" + Date.now(), name, qty: document.getElementById("add-qty").value.trim() || null });
    render(); document.getElementById("add-name")?.focus();
    return toast("Ajouté à ta liste ✓", `${name} — dans « Mes ajouts ». Emeline ne s'en occupe pas, c'est pour toi.`);
  }
  if (t.id === "empty-cart") {
    if (!confirm("Tes courses sont faites ?\n\nToute la liste redevient à acheter : les articles cochés, ceux marqués « J'ai déjà », et tes ajouts perso sont retirés.\n\nLa liste d'Emeline, tes plats et ta réservation ne bougent pas.")) return;
    V().checked.clear(); V().have.clear(); V().mine = []; render();
    return toast("Panier vidé ✓", "La liste est repartie à zéro. Tes plats et ta réservation ne bougent pas.");
  }
  if (t.id === "print") return toast("Impression", "Dans l'appli, ce bouton imprime la fiche ou l'enregistre en PDF.");
  if (t.id === "wa-client") return toast("Ouvrirait WhatsApp avec :", `Coucou Emeline ! C'est Axelle, j'ai réservé ${slotLabel(V().date)} 😊`);
});
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.check) { e.target.checked ? V().checked.add(d.check) : V().checked.delete(d.check); return render(); }
  if ("wbaby" in d) { plan(S.week).baby = e.target.checked; return render(); }
  if ("wshop" in d) { plan(S.week).shopping = e.target.checked; return render(); }
  if ("wsweet" in d) {
    plan(S.week).sweet = e.target.checked;
    if (!e.target.checked) inWeek(S.week, true).forEach(id => V().picks.delete(id));
    return render();
  }
});
document.addEventListener("input", e => { if (e.target.id === "wbaby-note") { plan(S.week).babyNote = e.target.value; save(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "add-name" || e.target.id === "add-qty")) document.getElementById("add-item").click(); });

render();
</script>
</html>
